<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>销售清单 · 东亚汽车玻璃</title>
<style>
  :root{
    --red:#c0392b;
    --red-soft:#fdeeec;
    --bg:#f4f5f7;
    --card:#ffffff;
    --line:#ecedf0;
    --text:#1c1e22;
    --muted:#8b9099;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    overflow:hidden;
  }
  /* ===== 手机外壳 ===== */
  .phone{
    width:100%;height:100dvh;
    background:var(--bg);
    display:flex;flex-direction:column;
    overflow:hidden;position:relative;
  }
  @media (min-width:640px){
    body{display:flex;align-items:center;justify-content:center;background:#e6e8ec;padding:24px;}
    .phone{
      width:400px;height:min(844px,92vh);
      border-radius:34px;border:9px solid #16181c;
      box-shadow:0 24px 60px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.35) inset;
    }
  }

  /* ===== 顶部应用栏 ===== */
  .appbar{
    flex:0 0 auto;
    background:#fff;border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex;align-items:center;gap:10px;
    position:relative;z-index:5;
  }
  .logo{
    width:34px;height:34px;border-radius:8px;object-fit:cover;
    flex:0 0 auto;display:block;
    box-shadow:0 2px 6px rgba(192,57,43,.22);
  }
  .titles{flex:1;min-width:0;}
  .titles h1{font-size:15.5px;font-weight:600;letter-spacing:.2px;}
  .titles p{font-size:11px;color:var(--muted);margin-top:1px;}
  .ghost-btn{
    border:1px solid var(--line);background:#fff;color:#4a4f57;
    font-size:12.5px;padding:6px 11px;border-radius:16px;
    cursor:pointer;flex:0 0 auto;
  }
  .ghost-btn:active{background:#f2f3f5;}

  /* ===== 内容区 ===== */
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;overflow-x:hidden;}
  input{min-width:0;}
  .cell,.field{min-width:0;}
  .view{display:none;padding:12px 12px 16px;}
  .view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border-radius:14px;
    padding:12px 12px 4px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,22,26,.04);
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .card-head b{font-size:13px;font-weight:600;}
  .card-head .sub{font-size:11.5px;color:var(--muted);}

  /* 字段 */
  .field{padding:7px 0;border-bottom:1px solid #f4f5f7;}
  .field:last-child{border-bottom:none;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.2px;}
  .field input{
    width:100%;border:none;background:transparent;
    font-size:14.5px;color:var(--text);padding:1px 0;
    font-family:inherit;
  }
  .field input::placeholder{color:#c3c7cd;}
  .field input:focus{outline:none;}
  .field input{min-width:0;max-width:100%;}
  /* 二维码：可见的原生文件按钮（各手机浏览器兼容性最好） */
  .qr-file{display:block;width:100%;max-width:100%;
    font-size:12.5px;color:#6b717a;font-family:inherit;}
  .qr-file::file-selector-button{
    border:1px solid #e6e2df;background:#fff;color:#1c1e22;
    font-size:13px;font-weight:500;font-family:inherit;
    padding:8px 16px;border-radius:18px;margin-right:10px;cursor:pointer;}
  .qr-file::file-selector-button:active{background:#faf8f7;border-color:#ded9d5;}
  .qr-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  #qrPrev{width:44px;height:44px;border-radius:8px;border:1px solid #e6e2df;background:#fff;object-fit:cover;}
  .qr-clear{font-size:12px;color:#c0392b;text-decoration:underline;cursor:pointer;}
  .qr-clear[hidden]{display:none;}
  #qrPrev[hidden]{display:none;}
  .qr-hint{margin-top:8px;font-size:11.5px;color:#8b9099;}
  /* 展开时给底部操作栏留出空间，避免二维码字段被压住点不到 */
  details.more[open]{margin-bottom:64px;}
  .field.focus{border-bottom-color:var(--red);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .two-col.addr-date{grid-template-columns:1.45fr 1fr;}

  /* 明细卡片 */
  .item{
    background:#fff;border-radius:14px;padding:10px 12px 11px;margin-bottom:10px;
    box-shadow:0 1px 2px rgba(20,22,26,.05);
    border:1px solid #f0f1f4;
  }
  .item-top{display:flex;align-items:center;gap:8px;}
  .idx{
    width:20px;height:20px;border-radius:6px;background:var(--red-soft);color:var(--red);
    font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .item-top .cell{flex:1;min-width:0;}
  .cell input.plate{font-weight:600;font-size:14.5px;}
  .cell-prod{margin-top:8px;}
  .cell input.prod{font-size:14px;}
  .del-btn{
    border:none;background:transparent;color:#c9ccd2;font-size:15px;
    width:26px;height:26px;border-radius:8px;cursor:pointer;flex:0 0 auto;
  }
  .del-btn:active{background:#f6f7f8;color:var(--red);}
  .item input.prod::placeholder{color:#c3c7cd;}
  .item input:focus{outline:none;}
  .item-grid{display:grid;grid-template-columns:1.5fr .9fr .8fr 1.05fr;gap:8px;}
  .cell{background:#f7f8fa;border-radius:9px;padding:5px 8px;}
  .cell span{display:block;font-size:10px;color:var(--muted);}
  .cell input{
    width:100%;border:none;background:transparent;font-size:13.5px;font-family:inherit;
    color:var(--text);padding:1px 0;
  }
  .cell input:focus{outline:none;}
  .item-sum{
    text-align:right;font-size:12px;color:var(--muted);margin-top:8px;
  }
  .item-sum b{color:var(--red);font-size:14px;font-weight:600;margin-left:2px;}

  .add-btn{
    width:100%;border:1px dashed #d8dbe1;background:#fff;border-radius:14px;
    padding:12px;font-size:13.5px;color:#6b717a;font-family:inherit;cursor:pointer;
    margin-bottom:12px;
  }
  .add-btn:active{background:#fafbfc;}

  /* 更多设置 */
  details.more{background:#fff;border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(20,22,26,.04);}
  details.more summary{
    list-style:none;padding:13px 14px;font-size:13px;color:#4a4f57;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
  }
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::after{content:"›";color:#c3c7cd;font-size:16px;transform:rotate(90deg);transition:.2s;}
  details.more[open] summary::after{transform:rotate(-90deg);}
  details.more .inner{padding:0 14px 12px;border-top:1px solid #f4f5f7;}

  /* 底部操作条 */
  .actionbar{
    position:sticky;bottom:0;
    margin:0 -12px -16px;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,#fff 78%,rgba(255,255,255,.92));
    border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    backdrop-filter:blur(6px);
  }
  .sum-info{flex:1;min-width:0;}
  .sum-info .lbl{font-size:10.5px;color:var(--muted);}
  .sum-info .val{font-size:19px;font-weight:700;color:var(--red);letter-spacing:-.3px;line-height:1.2;}
  .sum-info .val small{font-size:12px;font-weight:500;}
  .primary-btn{
    border:none;background:var(--red);color:#fff;border-radius:12px;
    padding:12px 20px;font-size:14.5px;font-weight:600;font-family:inherit;
    cursor:pointer;box-shadow:0 4px 12px rgba(192,57,43,.3);flex:0 0 auto;
  }
  .primary-btn:active{background:#a93226;transform:translateY(1px);}

  /* ===== 预览页 ===== */
  .paper-wrap{
    background:#fff;border-radius:12px;padding:8px;position:relative;
    box-shadow:0 2px 10px rgba(20,22,26,.07);cursor:zoom-in;
    -webkit-tap-highlight-color:transparent;
  }
  .zoom-hint{
    position:absolute;right:14px;bottom:-11px;
    background:#3a3f47;color:#fff;font-size:11px;
    padding:5px 11px;border-radius:20px;
    box-shadow:0 3px 10px rgba(20,22,26,.25);
    pointer-events:none;letter-spacing:.2px;
  }
  #canvas{width:100%;display:block;border-radius:6px;}
  .preview-tip{text-align:center;font-size:11.5px;color:var(--muted);margin:10px 0 14px;}
  .btn-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px;}
  .soft-btn{
    border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:12px 6px;font-size:13px;font-family:inherit;color:#3a3f47;cursor:pointer;
  }
  .soft-btn:active{background:#f5f6f8;}
  .soft-btn.solid{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}

  /* ===== 图片预览灯箱 ===== */
  .lightbox{
    position:fixed;inset:0;z-index:200;display:none;
    background:rgba(12,12,14,.94);
    padding:16px;overflow:auto;touch-action:pinch-zoom;
    -webkit-overflow-scrolling:touch;
  }
  .lightbox.show{display:block;}
  .lightbox .lb-scroll{
    min-height:100%;display:flex;align-items:center;justify-content:center;
  }
  .lightbox img{
    max-width:100%;max-height:calc(100vh - 170px);
    object-fit:contain;border-radius:4px;
    box-shadow:0 14px 50px rgba(0,0,0,.55);background:#fff;
    /* 允许长按唤起「存储图像」 */
    -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;
  }
  .lb-tip{font-size:11.5px;color:rgba(255,255,255,.62);text-align:center;margin-bottom:8px;letter-spacing:.2px;}
  .lb-btns{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;}
  .lb-close{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;
    width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.16);color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .lb-bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(12,12,14,.92), rgba(12,12,14,0));
  }
  .lb-bar button{
    border:none;border-radius:12px;padding:13px;font-size:14px;
    font-family:inherit;color:#fff;cursor:pointer;
    background:rgba(255,255,255,.15);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .lb-bar button.primary{background:var(--red);font-weight:600;}
  .lb-bar button:active{opacity:.82;}

  /* ===== 记录页 ===== */
  .rec{
    background:#fff;border-radius:14px;padding:12px 13px;margin-bottom:10px;
    display:flex;align-items:center;gap:11px;
    box-shadow:0 1px 2px rgba(20,22,26,.05);border:1px solid #f0f1f4;
    cursor:pointer;
  }
  .rec:active{background:#fafbfc;}
  .rec .avatar{
    width:38px;height:38px;border-radius:11px;background:var(--red-soft);color:var(--red);
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .rec .info{flex:1;min-width:0;}
  .rec .info b{font-size:14px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rec .info span{font-size:11.5px;color:var(--muted);}
  .rec .amt{font-size:15px;font-weight:600;color:var(--red);flex:0 0 auto;}
  .rec .rm{
    border:none;background:transparent;color:#d0d3d8;font-size:14px;padding:4px;cursor:pointer;flex:0 0 auto;
  }
  .empty{
    text-align:center;padding:70px 20px;color:#b6bac1;font-size:13px;line-height:2;
  }
  .empty .big{font-size:38px;display:block;margin-bottom:6px;opacity:.55;}

  /* ===== 底部 Tab ===== */
  .tabbar{
    flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);
    padding:6px 0 calc(4px + env(safe-area-inset-bottom));
    position:relative;z-index:6;
  }
  .tab{
    flex:1;border:none;background:none;padding:4px 0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:#9aa0a8;font-size:10.5px;font-family:inherit;
  }
  .tab .ic{font-size:19px;line-height:1.25;filter:grayscale(1) opacity(.55);transition:.15s;}
  .tab.active{color:var(--red);font-weight:600;}
  .tab.active .ic{filter:none;transform:translateY(-1px);}

  /* Toast */
  .toast{
    position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);
    background:rgba(28,30,34,.9);color:#fff;font-size:12.5px;
    padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;
    transition:.22s;white-space:nowrap;max-width:88%;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

    <div class="titles">
      <h1>销售清单</h1>
      <p>东亚汽车玻璃 · 开单开票</p>
    </div>
    <button class="ghost-btn" id="newBtn">新单</button>
  </header>

  <main id="scroller">
    <!-- ========== 开单 ========== -->
    <section class="view active" id="view-edit">
      <div class="card">
        <div class="card-head"><b>客户信息</b><span class="sub">客户名称必填</span></div>
        <div class="two-col">
          <div class="field"><label>客户名称</label>
            <input id="customer" placeholder="如：云积"></div>
          <div class="field"><label>客户电话</label>
            <input id="cphone" inputmode="tel" placeholder="选填"></div>
        </div>
        <div class="two-col addr-date">
          <div class="field"><label>客户地址</label>
            <input id="caddr" placeholder="选填"></div>
          <div class="field"><label>日期</label>
            <input id="date" type="date"></div>
        </div>
      </div>

      <div class="card-head" style="padding:0 4px;">
        <b style="font-size:13px;">货品明细</b>
        <span class="sub" id="itemCount"></span>
      </div>

      <div id="itemsBox"></div>
      <button class="add-btn" id="addRow">＋ 添加一行货品</button>

      <details class="more">
        <summary>更多设置 · 店铺信息 / 二维码</summary>
        <div class="inner">
          <div class="field"><label>店铺地址</label>
            <input id="saddr" value="长沙中南汽配城2C栋东头1098-1099号"></div>
          <div class="field"><label>店铺电话</label>
            <input id="sphone" value="0731-86808392/18900738916/18942565612"></div>
          <div class="field"><label>温馨提示</label>
            <input id="snote" value="玻璃属易碎品，取货时请确认货物数量和质量（划伤、爆边、裂隙等），逾时造成的损失由顾客自行承担！"></div>
          <div class="field"><label>右上角二维码</label>
            <input id="qr" type="file" accept="image/*" class="qr-file">
            <div class="qr-row">
              <img id="qrPrev" alt="" hidden>
              <span id="qrClear" class="qr-clear" hidden>清除二维码</span>
            </div>
            <div class="qr-hint">点按钮选一张，即自动保存，之后每次开单自动沿用 <span id="verTag"></span></div></div>
        </div>
      </details>

      <div class="actionbar">
        <div class="sum-info">
          <div class="lbl">合计金额 · <span id="barCount">0 项</span></div>
          <div class="val"><small>¥</small> <span id="barTotal">0.00</span></div>
        </div>
        <button class="primary-btn" id="genBtn">生成清单</button>
      </div>
    </section>

    <!-- ========== 清单 ========== -->
    <section class="view" id="view-preview">
      <div class="paper-wrap" id="paperWrap">
        <canvas id="canvas"></canvas>
        <div class="zoom-hint">点击放大</div>
      </div>
      <div class="preview-tip">点图片可全屏预览，长按大图也能直接存相册</div>
      <div class="btn-grid">
        <button class="soft-btn solid" id="download">保存图片</button>
        <button class="soft-btn" id="share">分享图片</button>
        <button class="soft-btn" id="copy">复制</button>
      </div>
      <div style="height:12px"></div>
    </section>

    <!-- ========== 记录 ========== -->
    <section class="view" id="view-history">
      <div id="recList"></div>
    </section>
  </main>

  <!-- Tab -->
  <nav class="tabbar">
    <button class="tab active" data-view="edit"><span class="ic">✏️</span>开单</button>
    <button class="tab" data-view="preview"><span class="ic">🧾</span>清单</button>
    <button class="tab" data-view="history"><span class="ic">📁</span>记录</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

    <div class="lb-btns">

      <button id="lbShare">分享</button>
    </div>
  </div>

/* ================= 数值 ================= */
function fmt(n){
  return Number(n||0).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function numToCN(num){
  num = Number(num)||0;
  if(num <= 0) return '零元整';
  const n = Math.round(num*100);
  const yuan = Math.floor(n/100), jiao = Math.floor(n%100/10), fen = n%10;
  const d = '零壹贰叁肆伍陆柒捌玖', u = ['','拾','佰','仟'], b = ['','万','亿','兆'];
  let s = '';
  if(yuan > 0){
    const groups = [];
    let t = String(yuan);
    while(t.length > 4){ groups.unshift(t.slice(-4)); t = t.slice(0,-4); }
    groups.unshift(t);
    let gi = groups.length;
    const parts = [];
    for(const g of groups){
      gi--;
      let gs = '', zero = false;
      for(let i = 0; i < g.length; i++){
        const digit = +g[i], pos = g.length - 1 - i;
        if(digit === 0){ zero = true; }
        else {
          if(zero && gs) gs += '零';
          gs += d[digit] + u[pos];
          zero = false;
        }
      }
      if(gs) parts.push(gs + b[gi]);
    }
    s = parts.join('') + '元';
  } else s = '零元';
  if(jiao === 0 && fen === 0) s += '整';
  else {
    if(yuan > 0 && jiao === 0 && fen > 0) s += '零';
    if(jiao > 0) s += d[jiao] + '角';
    if(fen > 0) s += d[fen] + '分';
  }
  return s;
}
function totalOf(list){
  return (list||items).reduce((s,it) => s + (parseFloat(it.qty)||0)*(parseFloat(it.price)||0), 0);
}

/* ================= 存储 ================= */
function saveDraft(){
  const data = {
    customer: v('customer'), cphone: v('cphone'), caddr: v('caddr'), date: v('date'),
    saddr: v('saddr'), sphone: v('sphone'), snote: v('snote'),
    items, id: currentId
  };
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch(e){}
}
function loadDraft(){
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    setv('customer', d.customer); setv('cphone', d.cphone); setv('caddr', d.caddr);
    setv('date', d.date || todayStr());
    setv('saddr', d.saddr); setv('sphone', d.sphone); setv('snote', d.snote);
    if(Array.isArray(d.items) && d.items.length) items = d.items;
    if(d.id) currentId = d.id;
  } catch(e){}
  if(!v('date')) setv('date', todayStr());
}
function loadRecords(){
  try { records = JSON.parse(localStorage.getItem(REC_KEY) || '[]'); } catch(e){ records = []; }
}
function persistRecords(){ try { localStorage.setItem(REC_KEY, JSON.stringify(records)); } catch(e){} }

/* ================= 明细渲染 ================= */
function renderItems(){
  const box = $('itemsBox');
  box.innerHTML = '';
  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-top">
        <div class="idx">${i+1}</div>
        <div class="cell cell-plate"><span>备注 / 车牌</span>
          <input class="plate" data-k="plate" value="${esc(it.plate)}" placeholder="如 湘A 8G128"></div>
        <button class="del-btn" title="删除">✕</button>
      </div>
      <div class="cell cell-prod"><span>产品名称</span>
        <input class="prod" data-k="product" value="${esc(it.product)}" placeholder="如 前挡风玻璃"></div>
      <div class="item-grid">
        <div class="cell"><span>品牌型号</span><input data-k="brand" value="${esc(it.brand)}" placeholder="选填"></div>
        <div class="cell"><span>单位</span><input data-k="unit" value="${esc(it.unit)}"></div>
        <div class="cell"><span>数量</span><input data-k="qty" inputmode="decimal" value="${esc(it.qty)}"></div>
        <div class="cell"><span>单价</span><input data-k="price" inputmode="decimal" value="${esc(it.price)}" placeholder="0.00"></div>
      </div>
      <div class="item-sum">金额<b>¥${fmt((parseFloat(it.qty)||0)*(parseFloat(it.price)||0))}</b></div>`;
    el.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        if(inp.dataset.k === 'plate'){
          const up = inp.value.toUpperCase();
          if(up !== inp.value){
            const pos = inp.selectionStart;
            inp.value = up;
            try { inp.setSelectionRange(pos, pos); } catch(e){}
          }
        }
        it[inp.dataset.k] = inp.value;
        el.querySelector('.item-sum b').textContent = '¥' + fmt((parseFloat(it.qty)||0)*(parseFloat(it.price)||0));
        updateBar(); saveDraft(); draw();
      });
      inp.addEventListener('focus', () => inp.parentElement.classList.add('focus'));
      inp.addEventListener('blur', () => inp.parentElement.classList.remove('focus'));
    });
    el.querySelector('.del-btn').addEventListener('click', () => {
      if(items.length === 1) items = [newItem()];
      else items.splice(i, 1);
      renderItems(); updateBar(); saveDraft(); draw();
    });
    box.appendChild(el);
  });
  updateBar();
}
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function updateBar(){
  const valid = items.filter(it => it.plate || it.product || it.price);
  $('barTotal').textContent = fmt(totalOf());
  $('barCount').textContent = valid.length + ' 项';
  $('itemCount').textContent = '共 ' + items.length + ' 行';
}

/* ================= Tab 切换 ================= */
function switchView(name){
  if(typeof closePreview === 'function') closePreview();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.view === name));
  $('view-' + name).classList.add('active');
  $('scroller').scrollTop = 0;
  if(name === 'preview'){ draw(); }
  if(name === 'history'){ renderRecords(); }
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if(t.dataset.view === 'preview' && items.every(it => !it.plate && !it.product && !it.price)){
    toast('先填一条货品再生成清单'); switchView('edit'); return;
  }
  switchView(t.dataset.view);
}));

/* 二维码：读入后裁成方形、缩到 480px 存 PNG，并写入 localStorage 长期沿用 */
function setQr(src, persist){
  const img = new Image();
  img.onload = () => {
    qrImg = img;
    $('qrPrev').src = src;
    $('qrPrev').hidden = false;
    $('qrClear').hidden = false;
    if(window.__appReady) draw();   /* 初始化阶段画布常量尚未就绪，交给末尾统一 draw() */
  };
  img.src = src;
  if(persist){
    try{ localStorage.setItem(QR_KEY, src); }
    catch(err){ toast('二维码图片过大，未能保存'); }
  }
}
function normalizeQr(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const side = Math.min(im.naturalWidth, im.naturalHeight) || 1;
      const S = 480;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      g.drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/png'));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load fail')); };
    im.src = url;
  });
}

});

});

  currentId = null;

});

/* ================= 记录 ================= */
function saveRecord(){
  const rec = {
    id: currentId || ('L' + Date.now()),
    ts: Date.now(),
    date: v('date') || todayStr(),
    customer: v('customer'),
    cphone: v('cphone'),
    caddr: v('caddr'),
    saddr: v('saddr'), sphone: v('sphone'), snote: v('snote'),
    items: JSON.parse(JSON.stringify(items)),
    total: totalOf()
  };
  currentId = rec.id;
  const idx = records.findIndex(r => r.id === rec.id);
  if(idx >= 0) records[idx] = rec; else records.unshift(rec);
  persistRecords(); refreshCustList(); saveDraft();
}
function renderRecords(){
  const box = $('recList');
  if(!records.length){
    box.innerHTML = `<div class="empty"><span class="big">🗂</span>还没有保存的清单<br>开单后点「生成清单」会自动存一份</div>`;
    return;
  }
  box.innerHTML = '';
  records.forEach(r => {
    const el = document.createElement('div');
    el.className = 'rec';
    const name = r.customer || '未填客户';
    el.innerHTML = `
      <div class="avatar">${esc(name.slice(0,1))}</div>
      <div class="info">
        <b>${esc(name)}</b>
        <span>${esc(r.date)} · ${r.items.length} 项</span>
      </div>
      <div class="amt">¥${fmt(r.total)}</div>
      <button class="rm">✕</button>`;
    el.addEventListener('click', e => {
      if(e.target.classList.contains('rm')) return;
      loadRecord(r.id);
    });
    el.querySelector('.rm').addEventListener('click', () => {
      if(!confirm('删除这条记录？')) return;
      records = records.filter(x => x.id !== r.id);
      persistRecords(); refreshCustList();
      if(currentId === r.id) currentId = null;
      renderRecords(); toast('已删除');
    });
    box.appendChild(el);
  });
}
function loadRecord(id){
  const r = records.find(x => x.id === id);
  if(!r) return;
  currentId = r.id;
  setv('customer', r.customer); setv('cphone', r.cphone); setv('caddr', r.caddr);
  setv('date', r.date); setv('saddr', r.saddr); setv('sphone', r.sphone); setv('snote', r.snote);
  items = r.items && r.items.length ? JSON.parse(JSON.stringify(r.items)) : [newItem()];
  renderItems(); saveDraft(); draw();
  switchView('preview');
  toast('已载入「' + (r.customer || '未填客户') + '」');
}

/* ================= 画布：清单排版 ================= */
const canvas = $('canvas');
const ctx = canvas.getContext('2d');

/* 版面按 9×5 英寸票据纸设计：96dpi 基准 864×480，导出 3 倍 ≈ 288dpi */
const W = 864, M = 56, CW = W - M * 2;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif';
const C = {
  red:'#C0392B', ink:'#141414',
  /* 标签与正文同色，靠字重/字号区分层级，打印出来浓淡一致 */
  sub:'#141414',
  line:'#948E88', edge:'#57524D',   /* 线条深灰，打印清楚 */
  head:'#FFFFFF', zebra:'#FFFFFF', total:'#FFFFFF'   /* 表格底色统一为纯白，只靠线条分隔 */
};
const HEAD_H = 29, ROW_H = 26, TOT_H = 33, TABLE_TOP = 152, QR_SIZE = 75;

const COLS = [
  {key:'idx',     label:'序号',     w:44,  align:'center'},  /* 序号居中 */
  {key:'plate',   label:'备注',     w:118, align:'left'},    /* 数据：左对齐 */
  {key:'product', label:'产品名称', w:246, align:'left'},
  {key:'brand',   label:'品牌型号', w:76,  align:'left'},
  {key:'unit',    label:'单位',     w:46,  align:'center'},
  {key:'qty',     label:'数量',     w:46,  align:'center'},
  {key:'price',   label:'销售价格', w:76,  align:'right'},
  {key:'amount',  label:'销售金额', w:100, align:'right'}
];
const cx = (() => { const a = [M]; COLS.forEach((c, i) => a.push(a[i] + c.w)); return a; })();

function font(size, weight){ ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT; }
function fitText(text, maxW){
  text = String(text == null ? '' : text);
  if(!text) return '';
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function put(text, x, colW, baseline, align, pad){
  pad = pad === undefined ? 10 : pad;
  const avail = Math.max(colW - pad * 2, 2);
  const t = fitText(text, avail);
  if(!t) return;
  const tw = ctx.measureText(t).width;
  let tx = x + pad;
  if(align === 'right') tx = x + colW - pad - tw;
  else if(align === 'center') tx = x + (colW - tw) / 2;
  ctx.fillText(t, tx, baseline);
}
/* 优先缩字号保完整：从 baseSize 逐级缩到 minSize，仍放不下才打省略号 */
function putFit(text, x, colW, baseline, align, pad, baseSize, minSize, weight){
  pad = pad === undefined ? 6 : pad;
  const avail = Math.max(colW - pad * 2, 2);
  text = String(text == null ? '' : text);
  if(!text) return;
  let size = baseSize;
  font(size, weight || 500);
  while(size > minSize && ctx.measureText(text).width > avail){
    size -= 0.5;
    font(size, weight || 500);
  }
  const t = fitText(text, avail);
  if(!t) return;
  const tw = ctx.measureText(t).width;
  let tx = x + pad;
  if(align === 'right') tx = x + colW - pad - tw;
  else if(align === 'center') tx = x + (colW - tw) / 2;
  ctx.fillText(t, tx, baseline);
}
function hl(x1, y, x2){ ctx.beginPath(); ctx.moveTo(x1, y + 0.5); ctx.lineTo(x2, y + 0.5); ctx.stroke(); }
function vl(x, y1, y2){ ctx.beginPath(); ctx.moveTo(x + 0.5, y1); ctx.lineTo(x + 0.5, y2); ctx.stroke(); }

function draw(){
  /* 只保留真正填过内容的明细行，空行不占位 */
  const filled = items.filter(it =>
    String(it.plate || '').trim() || String(it.product || '').trim() || String(it.price == null ? '' : it.price).trim()
  );
  const rows = filled.map((it, i) => {
    const qty = parseFloat(it.qty) || 0;
    const price = parseFloat(it.price) || 0;
    return {
      idx: String(i + 1),
      plate: (it.plate || '').toUpperCase(),
      product: it.product || '',
      brand: it.brand || '',
      unit: it.unit || '块',
      qty: it.qty === '' ? '' : String(qty),
      price: price ? fmt(price) : '',
      amount: (qty && price) ? fmt(qty * price) : ''
    };
  });
  /* ---------- 动态列宽：备注/产品名称随内容加宽，其余列相应收缩，表格外框总宽不变 ---------- */
  const BASE_W = [44, 118, 246, 76, 46, 46, 76, 100];
  const MIN_W  = [40, 118, 246, 40, 36, 36, 62, 78];
  font(14, 500);
  let needPlate = 0, needProd = 0;
  rows.forEach(r => {
    needPlate = Math.max(needPlate, ctx.measureText(String(r.plate || '')).width);
    needProd  = Math.max(needProd,  ctx.measureText(String(r.product || '')).width);
  });
  const wantPlate = Math.max(BASE_W[1], Math.ceil(needPlate) + 18);
  const wantProd  = Math.max(BASE_W[2], Math.ceil(needProd) + 18);
  let extra = (wantPlate - BASE_W[1]) + (wantProd - BASE_W[2]);
  const ws = BASE_W.slice();
  /* 从可收缩列扣：品牌型号(可遮挡)→销售金额→销售价格→序号→单位→数量 */
  const donors = [3, 7, 6, 0, 4, 5];
  donors.forEach(d => {
    const take = Math.min(ws[d] - MIN_W[d], Math.max(extra, 0));
    ws[d] -= take; extra -= take;
  });
  /* 腾出的空间全部分给备注/产品名称：备注优先，其余给产品名称 */
  const give = CW - ws.reduce((s, w) => s + w, 0);
  if(give > 0){
    const gp = Math.min(wantPlate - BASE_W[1], give);
    ws[1] += gp;
    ws[2] += give - gp;
  }
  ws.forEach((w, wi) => { COLS[wi].w = w; });
  cx.length = 0; let acc = M;
  COLS.forEach(c => { cx.push(acc); acc += c.w; });

  const nRows = Math.max(rows.length, 1);
  const total = totalOf();
  const note = v('snote');
  const tableBottom = TABLE_TOP + HEAD_H + ROW_H * nRows + TOT_H;
  /* 页面固定一页 9×5，行多才向下延伸；行高恒定，不随行数变化 */
  /* 页面高度随内容：表格下紧跟页脚，不留一大片空白 */
  const H = tableBottom + (note ? 70 : 52);
  const scale = 3;

  canvas.width = W * scale; canvas.height = H * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 1;

  /* ---------- 抬头（标题整体居中） ---------- */
  const TITLE = '东亚汽车玻璃销售清单';
  font(26, 700);
  const tw = ctx.measureText(TITLE).width;
  const tx = (W - tw) / 2;
  ctx.fillStyle = C.ink;
  ctx.fillText(TITLE, tx, 62);
  if(logoReady) ctx.drawImage(logoImg, tx - 15 - 44, 30, 44, 44);

  ctx.save();
  ctx.letterSpacing = '1.4px';
  font(10.5, 500);
  const SUB = 'EAST ASIA AUTO GLASS';
  const sw = ctx.measureText(SUB).width;
  ctx.fillStyle = '#5A5A5A';
  ctx.fillText(SUB, (W - sw) / 2, 81);
  ctx.restore();

  const qx = W - M - QR_SIZE, qy = 30;   /* 缩小后与标题区大致居中 */
  if(qrImg){
    ctx.drawImage(qrImg, qx, qy, QR_SIZE, QR_SIZE);
  } else {
    ctx.fillStyle = '#FAF8F7';
    ctx.fillRect(qx, qy, QR_SIZE, QR_SIZE);
    ctx.strokeStyle = '#E3DEDB';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(qx + 0.5, qy + 0.5, QR_SIZE - 1, QR_SIZE - 1);
    ctx.setLineDash([]);
    font(11);
    ctx.fillStyle = '#7E7973';
    ctx.textAlign = 'center';
    ctx.fillText('二维码', qx + QR_SIZE / 2, qy + QR_SIZE / 2 + 3.5);
    ctx.textAlign = 'left';
  }

  ctx.strokeStyle = C.line;
  hl(M, 92, qx - 12);   /* 分隔线止于二维码左侧，二维码横跨标题与信息行 */

  /* ---------- 客户信息 ---------- */
  function kv(label, value, x, baseline, maxW){
    font(12.5, 500);
    ctx.fillStyle = C.sub;
    ctx.fillText(label, x, baseline);
    const lw = ctx.measureText(label).width;
    const avail = Math.max(maxW - lw - 8, 10);
    let t = String(value == null ? '' : value);
    let size = 14;
    font(size, 700);
    while(size > 10.5 && ctx.measureText(t).width > avail){
      size -= 1;
      font(size, 700);
    }
    ctx.fillStyle = C.ink;
    t = fitText(t, avail);
    if(t) ctx.fillText(t, x + lw + 8, baseline);
  }
  const GAP = 24, COLW = (CW - QR_SIZE - 12 - GAP) / 2, RX = M + COLW + GAP;
  /* 两行信息行距收紧到与字号相当（约 1.4 倍字体高），上下与标题/表格靠紧 */
  const ROW1 = 117, ROW2 = ROW1 + 20;   /* 按中文字高对齐：上下视觉空隙一致 */
  kv('客户名称', v('customer'), M,  ROW1, COLW);
  kv('客户电话', v('cphone'),   RX, ROW1, COLW);
  kv('客户地址', v('caddr'),    M,  ROW2, COLW);
  kv('单据日期', v('date') || todayStr(), RX, ROW2, COLW);

  /* ---------- 表格 ---------- */
  const T = TABLE_TOP;
  const bodyTop = T + HEAD_H;
  const totTop = bodyTop + ROW_H * nRows;

  ctx.fillStyle = C.head;   ctx.fillRect(M, T, CW, HEAD_H);
  ctx.fillStyle = C.zebra;
  for(let i = 1; i < nRows; i += 2) ctx.fillRect(M, bodyTop + ROW_H * i, CW, ROW_H);
  ctx.fillStyle = C.total;  ctx.fillRect(M, totTop, CW, TOT_H);

  font(13, 700);
  ctx.fillStyle = C.ink;
  COLS.forEach((c, i) => putFit(c.label, cx[i], c.w, T + Math.round(HEAD_H * 0.64), 'center', 5, 13, 8.5, 700));  /* 表头统一居中，窄列自动缩字号 */

  rows.forEach((r, ri) => {
    const baseline = bodyTop + ROW_H * ri + Math.round(ROW_H * 0.67);
    COLS.forEach((c, ci) => {
      const isNum = c.key === 'price' || c.key === 'amount';
      ctx.fillStyle = C.ink;
      if(c.key === 'plate' || c.key === 'product'){
        /* 备注/产品名称：先靠动态列宽，仍放不下则缩字号，保证内容完整显示 */
        putFit(r[c.key], cx[ci], c.w, baseline, c.align, 6, 14, 9, 500);
      } else {
        font(14, isNum ? 700 : 500);
        put(r[c.key], cx[ci], c.w, baseline, c.align, 10);
      }
    });
  });

  /* ---------- 合计行 ---------- */
  const tb = totTop + Math.round(TOT_H * 0.63);
  const lab = '合计金额（大写）';
  font(12.5, 400);
  ctx.fillStyle = C.sub;
  ctx.fillText(lab, M + 16, tb);
  const lw = ctx.measureText(lab).width;
  font(14, 600);
  ctx.fillStyle = C.ink;
  ctx.fillText(fitText(numToCN(total), cx[7] - M - 40 - lw), M + 16 + lw + 10, tb);

  /* 金额：黑色，超宽时等比压缩，绝不越出金额格 */
  const amt = '¥' + fmt(total);
  font(16, 700);
  const maxW = COLS[7].w - 22;
  const aw = ctx.measureText(amt).width;
  const rx = cx[7] + COLS[7].w - 11;   /* 与金额列数据一致：右对齐 */
  ctx.fillStyle = C.ink;
  if(aw <= maxW){
    ctx.fillText(amt, rx - aw, tb);
  } else {
    ctx.save();
    ctx.translate(rx, tb);
    ctx.scale(maxW / aw, 1);
    ctx.fillText(amt, -aw, 0);
    ctx.restore();
  }

  /* ---------- 线 ---------- */
  ctx.strokeStyle = C.edge;
  ctx.strokeRect(M + 0.5, T + 0.5, CW - 1, tableBottom - T - 1);
  hl(M, bodyTop, M + CW);
  hl(M, totTop, M + CW);
  ctx.strokeStyle = C.line;
  for(let i = 1; i < nRows; i++) hl(M, bodyTop + ROW_H * i, M + CW);
  for(let i = 1; i < COLS.length; i++){
    const isAmt = i === COLS.length - 1;
    ctx.strokeStyle = isAmt ? C.edge : C.line;
    vl(cx[i], T, isAmt ? tableBottom : totTop);
  }

  /* ---------- 页脚 ---------- */
  /* 页脚紧跟表格下沿，随内容走 */
  const fy = tableBottom + 8;    /* 分隔线贴近表格下沿 */
  ctx.strokeStyle = C.line;
  hl(M, fy, M + CW);
  font(12, 500);
  ctx.fillStyle = C.ink;
  ctx.fillText(fitText('地址：' + v('saddr'), CW * 0.58), M, fy + 17);
  const ph = '电话：' + v('sphone');
  ctx.fillText(ph, M + CW - ctx.measureText(ph).width, fy + 17);
  if(note) ctx.fillText(fitText('温馨提示：' + note, CW), M, fy + 35);
}

/* ================= 导出 / 预览 ================= */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(navigator.userAgent);
const isWeChat = /MicroMessenger/i.test(navigator.userAgent);

function fileName(){
  return '销售清单_' + (v('customer') || '客户') + '_' + (v('date') || todayStr()) + '.png';
}
/* 给导出的 PNG 写入物理尺寸信息：打印时按 288dpi 解释，宽度正好 9 英寸 */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(b){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function withDPI(blob, dpi){
  const src = new Uint8Array(await blob.arrayBuffer());
  const ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9);                                  // 数据长度
  chunk[4] = 0x70; chunk[5] = 0x48; chunk[6] = 0x59; chunk[7] = 0x73; // 'pHYs'
  dv.setUint32(8, ppm);                                // X 方向 像素/米
  dv.setUint32(12, ppm);                               // Y 方向
  chunk[16] = 1;                                       // 单位：米
  dv.setUint32(17, crc32(chunk.subarray(4, 17)));      // CRC
  const out = new Uint8Array(src.length + 21);
  out.set(src.subarray(0, 33), 0);                     // 签名 + IHDR
  out.set(chunk, 33);
  out.set(src.subarray(33), 54);
  return new Blob([out], { type: 'image/png' });
}
async function canvasBlob(){
  const raw = await new Promise(res => canvas.toBlob(res, 'image/png'));
  try { return await withDPI(raw, Math.round(canvas.width / 9)); }
  catch(e){ return raw; }
}
async function canvasFile(){
  const blob = await canvasBlob();
  return new File([blob], fileName(), { type: 'image/png' });
}

/* 保存：安卓/电脑直接落到相册（下载目录），iOS 走系统面板「存储图像」 */
async function saveImage(){
  const file = await canvasFile();
  /* 微信/企微内置浏览器会拦截下载，先提示改用系统浏览器 */
  if(isWeChat){
    toast('微信内无法保存，请点右上角「在浏览器打开」后再保存');
    return;
  }
  /* iPhone/iPad：只能经由系统分享面板存进相册 */
  if(isIOS && navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({ files: [file], title: '销售清单' });
      return;
    } catch(e){ if(e && e.name === 'AbortError') return; }
  }
  /* 安卓/电脑：走浏览器下载，文件落在「下载/文件」里 */
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name;
  a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  toast(isAndroid
    ? '已存到「文件/下载」；要进相册请点图片长按保存'
    : '图片已下载，可在下载文件夹查看');
}

/* 分享：直接把 PNG 文件分享出去 */
async function shareImage(){
  const file = await canvasFile();
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({
        files: [file],
        title: '销售清单' + (v('customer') ? '·' + v('customer') : ''),
        text: '东亚汽车玻璃销售清单'
      });
      return;
    } catch(e){ if(e && e.name === 'AbortError') return; }
  }
  toast('当前浏览器不能直接分享，请用「保存图片」');
}

$('download').addEventListener('click', saveImage);
$('share').addEventListener('click', shareImage);
$('copy').addEventListener('click', async () => {
  try {
    const blob = await canvasBlob();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('已复制图片，可直接粘贴发送');
  } catch(e){
    toast('此浏览器不支持复制，请用保存图片');
  }
});

/* ---------- 全屏预览 ---------- */
const lb = $('lightbox');
function openPreview(){
  $('lbImg').src = canvas.toDataURL('image/png');
  $('lightbox').classList.add('show');
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
}
function closePreview(){
  const box = $('lightbox');
  if(!box) return;
  box.classList.remove('show');
  $('lbImg').src = '';
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
}
$('paperWrap').addEventListener('click', openPreview);
$('lbClose').addEventListener('click', closePreview);
$('lbSave').addEventListener('click', saveImage);
$('lbShare').addEventListener('click', shareImage);
lb.addEventListener('click', e => { if(e.target === lb || e.target.classList.contains('lb-scroll')) closePreview(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && lb.classList.contains('show')) closePreview(); });

/* ================= 启动 ================= */
loadRecords();
loadDraft();
refreshCustList();
renderItems();
window.__appReady = true;
draw();
</script>
